name: ulshms-development
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: hms
      POSTGRES_USER: hms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for local development}
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hms -d hms"]
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.31.4
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
    volumes: ["mail-data:/data"]
    environment:
      MP_DATABASE: /data/mailpit.db
volumes:
  postgres-data:
  mail-data:
